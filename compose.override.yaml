services:
  app:
    command: ["flask", "--app", "app", "run", "--debug", "--host=0.0.0.0", "--port=8000"]
    develop:
      watch:
        - action: sync
          path: ./App
          target: /app
          ignore:
            - requirements.txt
        - action: rebuild
          path: ./App/requirements.txt
        - action: rebuild
          path: ./Dockerfile
